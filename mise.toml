[tools]
actionlint = "1.7.12"
betterleaks = "1.8.1"
bun = "1.4.2"
lefthook = "2.1.14"
"http:constitution" = { version = "0.31.0", url = "https://github.com/droneey/constitution/releases/download/v{{ version }}/constitution.tar.gz", strip_components = 0, checksum = "sha256:f8dcabec42f3f77ff264d0060bae6e027b559f7d09f3d590c1fe21fb5599257f" }

[hooks]
postinstall = [
  "ln -sfn \"$(mise where http:constitution)\" .constitution",
  "lefthook install",
]

[settings]
lockfile = true

[tool_config]
locked = true
