[tools]
actionlint = "1.7.12"
betterleaks = "1.8.1"
bun = "1.4.2"
lefthook = "2.1.14"
"http:constitution" = { version = "0.33.0", url = "https://github.com/droneey/constitution/releases/download/v{{ version }}/constitution.tar.gz", strip_components = 0, checksum = "sha256:8331e8c085e6bd9a653729445fae12d1a632e0490fe296f5934e795d19f3f746" }

[hooks]
postinstall = [
  "ln -sfn \"$(mise where http:constitution)\" .constitution",
  "lefthook install",
]

[settings]
lockfile = true

[tool_config]
locked = true
