name: 🐛 Bug report
description: Something behaves differently from what the docs say
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The `@droneey/devkit-ts-*` version from your package.json
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: Relevant output, with secrets removed
      render: shell
