name: ☑️ Check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🟢 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔍 Lint
        run: bun run lint:check

      - name: 📦 Lint packages
        run: bun run lint:packages

      - name: 🔨 Build packages
        run: |
          for pkg in packages/typescript/libs/*/; do
            if [ -f "$pkg/package.json" ] && grep -q '"build"' "$pkg/package.json"; then
              (cd "$pkg" && bun run build)
            fi
          done

      - name: 🧪 Test
        run: bun run test:unit

      - name: ✅ Lint the workflows
        run: |
          set -euo pipefail
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/actionlint" -color
