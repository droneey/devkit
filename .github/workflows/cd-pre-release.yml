name: 🔖 Pre-release

on:
  push:
    tags: ['v*']

jobs:
  pre-release:
    uses: droneey/.github/.github/workflows/cd-release.yml@v2.0.0
    permissions:
      contents: write
    with:
      prerelease: true

  common:
    needs: pre-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Pack the common area
        run: |
          set -euo pipefail
          tar --exclude='__tests__' -czf devkit.tar.gz -C packages common
          sha256sum devkit.tar.gz > devkit.tar.gz.sha256

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" devkit.tar.gz devkit.tar.gz.sha256 --clobber
